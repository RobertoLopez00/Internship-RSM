# Opens pull requests when dependencies have new versions or security fixes. Minor and patch updates are
# grouped into one pull request per ecosystem so they don't flood the repository; major versions come
# separately because they can break things.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/Backend/*"
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

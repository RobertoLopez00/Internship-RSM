name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that's still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Real SQL Server for SqlServerTests: they run the migrations and the SQL Server-only constraints.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiPassword123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s
    env:
      SQLSERVER_TEST_CONNECTION: "Server=localhost,1433;User Id=sa;Password=CiPassword123!;TrustServerCertificate=True;"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Backend/ClinicaDental.slnx
      - name: Build
        run: dotnet build Backend/ClinicaDental.slnx --no-restore -c Release
      - name: Test
        run: dotnet test Backend/ClinicaDental.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint --deny-warnings
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
